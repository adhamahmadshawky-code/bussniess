<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>PERSONAL BRAND — MASTER TEMPLATE</title>
  <meta name="description" content="A reusable, data-driven personal brand website template. Every client detail lives in assets/js/config.js.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#d8b26b">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="PERSONAL BRAND — MASTER TEMPLATE">
  <meta property="og:description" content="A reusable, data-driven personal brand website template.">
  <meta property="og:image" content="assets/branding/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PERSONAL BRAND — MASTER TEMPLATE">
  <meta name="twitter:description" content="A reusable, data-driven personal brand website template.">
  <meta name="twitter:image" content="assets/branding/og-image.jpg">

  <link rel="icon" href="assets/branding/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <noscript>
    <div class="nojs">
      This template renders every section from <code>assets/js/config.js</code>. Please enable JavaScript to view it.
    </div>
  </noscript>

  <div id="site-header-root"></div>

  <main id="main">
    <section class="section section--hero" id="home" data-render="hero" hidden></section>
    <section class="section section--socials" id="social" data-render="socials" hidden></section>
    <section class="section section--about" id="about" data-render="about" hidden></section>
    <section class="section section--services" id="services" data-render="services" hidden></section>
    <section class="section section--work" id="work" data-render="work" hidden></section>
    <section class="section section--proof" id="proof" data-render="proof" hidden></section>
    <section class="section section--contact" id="contact" data-render="contact" hidden></section>
  </main>

  <footer class="site-footer" data-render="footer"></footer>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/icons.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
